<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frox Games</title>
<meta name="description" content="Frox Games makes mobile puzzle games. Sandomino: Sand Color Puzzle is out on Google Play.">
<link rel="icon" href="icon.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
         background: #1f2a52; color: #1f2a52; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 32px 20px; }
  h1 { color: #fff6e0; font-size: 52px; line-height: 1.1; letter-spacing: .5px; margin: 0 0 32px; }
  .card { background: #fff6e0; border-radius: 22px; padding: 48px 28px 52px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,.18); }
  .card img { width: 128px; height: 128px; border-radius: 28px; display: block; margin: 0 auto 16px; }
  h2 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 22px; }
  a.btn { display: inline-block; background: #2fb463; color: #fff; text-decoration: none; font-weight: 700; padding: 13px 26px; border-radius: 14px; box-shadow: 0 5px 0 #1f8a49; }
  a.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1f8a49; }
  footer { margin-top: 30px; color: #c9d0ea; font-size: 14px; text-align: center; }
  footer a { color: #fff6e0; }
</style>
</head>
<body>
  <h1>Frox Games</h1>
  <main class="card">
    <img src="icon.png" alt="Sandomino icon" width="128" height="128">
    <h2>Sandomino: Sand Color Puzzle</h2>
    <p>Drag boxes, drain the sand picture color by color, then watch it build back up.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.sand.blocks.color.fill">Get it on Google Play</a>
  </main>
  <footer>
    <a href="https://docs.google.com/document/d/e/2PACX-1vTsmp2vXxMh0MF5D_ZCH1NCEHkgTe1Lxp0orQT-uVMd920ziW7NDblbZI33Df4hTUFSLWpsWLu898wE/pub">Privacy Policy</a>
    <br>&copy; 2026 Frox Games
  </footer>
</body>
</html>
